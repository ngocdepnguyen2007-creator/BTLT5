<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 27 - Xóa Dòng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; background-color: #c8e6c9; }
        td, th { border: 2px solid #283593; padding: 8px; font-weight: bold; }
        input { padding: 5px; width: 100px; }
        button { border-radius: 50%; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <td>Số lượng</td><td>Đơn giá</td><td>Tổng</td><td>Chức năng</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" value="2" style="width: 60px;"></td>
                <td><input type="number" value="1000000"></td>
                <td><input type="number" value="2000000" readonly></td>
                <td style="text-align: center;"><button onclick="xoaDong(this)">Xóa</button></td>
            </tr>
            <tr>
                <td><input type="number" value="1" style="width: 60px;"></td>
                <td><input type="number" value="500000"></td>
                <td><input type="number" value="500000" readonly></td>
                <td style="text-align: center;"><button onclick="xoaDong(this)">Xóa</button></td>
            </tr>
        </tbody>
    </table>

    <script>
        function xoaDong(btn) {
            let dong = btn.closest('tr');
            if (confirm("Bạn có chắc chắn muốn xóa dòng này?")) {
                dong.remove();
            }
        }
    </script>
</body>
</html>
